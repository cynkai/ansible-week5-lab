---
- name: Switch back (rollback)
  hosts: lb
  gather_facts: false
  tasks:
    - name: Read current default_backend
      ansible.builtin.command: awk '/default_backend/{print $2}' /etc/haproxy/haproxy.cfg
      register: cur
      changed_when: false

    - name: Point frontend to the other color
      ansible.builtin.include_role:
        name: haproxy
      vars:
        haproxy_active_color: "{{ 'green' if cur.stdout.startswith('blue') else 'blue' }}"

    - name: Apply now
      ansible.builtin.meta: flush_handlers
