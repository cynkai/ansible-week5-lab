---
- name: Parameterized deploy
  hosts: "{{ target_hosts | default('web') }}"
  gather_facts: false
  serial: 1
  vars:
    dry_run: "true"
  tasks:
    - name: Show what will run
      ansible.builtin.debug:
        msg: >-
          host={{ inventory_hostname }}
          version={{ app_version }}
          dry_run={{ dry_run }} (type={{ dry_run | type_debug }})
      tags: always

    - name: Deploy webapp
      ansible.builtin.include_role:
        name: webapp
      when: (dry_run | string | lower) == 'false'
      tags: deploy
